<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="warmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eddcd2"/>
      <stop offset="50%" stop-color="#f5ebe0"/>
      <stop offset="100%" stop-color="#e6ccb2"/>
    </linearGradient>
    <linearGradient id="timberFacade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b07d62"/>
      <stop offset="100%" stop-color="#7f4f24"/>
    </linearGradient>
    <linearGradient id="concreteWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#938173"/>
      <stop offset="100%" stop-color="#6b5b50"/>
    </linearGradient>
    <linearGradient id="warmGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf0d5" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d4a373" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#warmSky)"/>

  <!-- Sun angle and position -->
  <line x1="140" y1="40" x2="660" y2="440" stroke="#b8582d" stroke-width="0.8" stroke-dasharray="5,5" opacity="0.3"/>
  <circle cx="160" cy="75" r="26" fill="#ddb892" opacity="0.4"/>
  <circle cx="160" cy="75" r="14" fill="#b8582d"/>
  <text x="195" y="80" fill="#7f4f24" font-family="sans-serif" font-size="11" font-weight="600">Solar Daylight Study • 35° Altitude</text>

  <!-- Ground Plane (Warm Sand & Soil) -->
  <polygon points="100,410 400,320 700,410 400,470" fill="#d0c4b4" stroke="#8d8171" stroke-width="1.2"/>
  <line x1="200" y1="390" x2="500" y2="390" stroke="#b5a999" stroke-width="1"/>
  <line x1="300" y1="350" x2="600" y2="350" stroke="#b5a999" stroke-width="1"/>

  <!-- Architectural Main Volume (Warm Timber & Earth Concrete) -->
  <!-- Left Side Face -->
  <polygon points="260,335 400,375 400,200 260,170" fill="url(#concreteWall)" stroke="#4a3e35" stroke-width="1.5"/>
  <!-- Right Side Face -->
  <polygon points="400,375 560,315 560,140 400,200" fill="url(#timberFacade)" stroke="#4a3e35" stroke-width="1.5"/>
  <!-- Top Roof Face -->
  <polygon points="260,170 400,200 560,140 420,115" fill="#a49384" stroke="#4a3e35" stroke-width="1.5"/>

  <!-- Cantilevered Warm Glass Pavilion -->
  <polygon points="220,260 380,310 380,210 220,170" fill="url(#warmGlass)" stroke="#b8582d" stroke-width="2"/>
  <polygon points="380,310 490,265 490,165 380,210" fill="url(#warmGlass)" stroke="#b8582d" stroke-width="2"/>
  <polygon points="220,170 380,210 490,165 330,130" fill="#eddcd2" fill-opacity="0.6" stroke="#b8582d" stroke-width="1.5"/>

  <!-- Interior Lighting Glow (Warm amber) -->
  <ellipse cx="320" cy="245" rx="35" ry="14" fill="#faedcd" opacity="0.4"/>
  <ellipse cx="430" cy="225" rx="30" ry="12" fill="#faedcd" opacity="0.35"/>

  <!-- Clean Structural Framing Lines -->
  <line x1="220" y1="170" x2="220" y2="260" stroke="#b8582d" stroke-width="1.5"/>
  <line x1="380" y1="210" x2="380" y2="310" stroke="#b8582d" stroke-width="1.5"/>
  <line x1="490" y1="165" x2="490" y2="265" stroke="#b8582d" stroke-width="1.5"/>

  <!-- Natural Vegetation (Warm Sage & Olive trees) -->
  <path d="M190 380 C180 340, 230 330, 220 380 Z" fill="#586443"/>
  <path d="M570 360 C560 310, 610 300, 600 360 Z" fill="#4b5738"/>
  <path d="M620 380 C610 330, 660 320, 650 380 Z" fill="#586443"/>

  <!-- Frame & Caption -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#b8582d" stroke-width="1" stroke-opacity="0.4"/>
  <text x="50" y="55" fill="#b8582d" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">PROJECT 03 • 3D SPATIAL &amp; ENVIRONMENTAL MODELING</text>
  <text x="50" y="75" fill="#241e1b" font-family="sans-serif" font-weight="800" font-size="16">SketchUp to Twinmotion Real-Time Pipeline</text>

  <!-- Caption Box -->
  <rect x="525" y="415" width="230" height="40" fill="#ede5d8" rx="4" stroke="#baaf9e" stroke-width="1"/>
  <text x="540" y="432" fill="#7f4f24" font-family="sans-serif" font-size="10" font-weight="700">Twinmotion Real-Time Rendering</text>
  <text x="540" y="446" fill="#575047" font-family="sans-serif" font-size="8">PBR Timber, Concrete &amp; Natural Lighting</text>
</svg>
