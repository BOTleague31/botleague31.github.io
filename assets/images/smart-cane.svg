<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="kraftPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#ebe4d5"/>
    </linearGradient>
    <pattern id="draftGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ded5c4" stroke-width="0.8"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#kraftPaper)"/>
  <rect width="800" height="500" fill="url(#draftGrid)"/>

  <!-- Architectural Drafting Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#8d8171" stroke-width="1.2"/>
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="#c2b6a3" stroke-width="0.6"/>

  <!-- Header -->
  <text x="50" y="60" fill="#b8582d" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">PROJECT 01 • EMBEDDED ASSISTIVE SYSTEM</text>
  <text x="50" y="82" fill="#241e1b" font-family="sans-serif" font-weight="800" font-size="18">Smart Cane Sensor &amp; Haptic Subsystem</text>

  <!-- Smart Cane Shaft & Chassis (Warm Charcoal & Terracotta) -->
  <line x1="260" y1="120" x2="260" y2="430" stroke="#4a423a" stroke-width="12" stroke-linecap="round"/>
  <line x1="260" y1="120" x2="260" y2="430" stroke="#b8582d" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Cane Handle -->
  <path d="M260 150 C260 95, 200 95, 190 140" fill="none" stroke="#2c2621" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Ultrasonic Sensor Mount -->
  <rect x="240" y="230" width="40" height="65" rx="4" fill="#38312b" stroke="#8d8171" stroke-width="1.5"/>
  <circle cx="260" cy="248" r="8" fill="#ede6da" stroke="#b8582d" stroke-width="2"/>
  <circle cx="260" cy="275" r="8" fill="#ede6da" stroke="#b8582d" stroke-width="2"/>
  
  <!-- Acoustic Wave Pulses (Terracotta warm arcs) -->
  <path d="M300 240 C320 230, 320 285, 300 280" fill="none" stroke="#b8582d" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M330 225 C360 210, 360 305, 330 295" fill="none" stroke="#b8582d" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M360 210 C400 190, 400 325, 360 310" fill="none" stroke="#b8582d" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="390" y="265" fill="#8c4724" font-family="sans-serif" font-size="11" font-weight="600">40 kHz Ultrasonic Pulse Cone</text>

  <!-- Microcontroller Board (Warm Olive & Kraft Brown) -->
  <rect x="490" y="130" width="240" height="280" rx="6" fill="#3e4a36" stroke="#5b6c50" stroke-width="2"/>
  <rect x="505" y="145" width="210" height="250" fill="#2d3627" stroke="#48563e" stroke-width="1"/>
  
  <!-- MCU Chip -->
  <rect x="555" y="215" width="110" height="110" rx="4" fill="#1e241b" stroke="#6b7c61" stroke-width="1.5"/>
  <text x="575" y="265" fill="#ede7dc" font-family="monospace" font-size="12" font-weight="700">ATmega328P</text>
  <text x="590" y="285" fill="#a4b39b" font-family="monospace" font-size="10">Arduino IDE</text>

  <!-- Pins -->
  <line x1="545" y1="235" x2="555" y2="235" stroke="#ded8cb" stroke-width="2"/>
  <line x1="545" y1="255" x2="555" y2="255" stroke="#ded8cb" stroke-width="2"/>
  <line x1="545" y1="275" x2="555" y2="275" stroke="#ded8cb" stroke-width="2"/>
  <line x1="545" y1="295" x2="555" y2="295" stroke="#ded8cb" stroke-width="2"/>
  <line x1="665" y1="235" x2="675" y2="235" stroke="#ded8cb" stroke-width="2"/>
  <line x1="665" y1="255" x2="675" y2="255" stroke="#ded8cb" stroke-width="2"/>
  <line x1="665" y1="275" x2="675" y2="275" stroke="#ded8cb" stroke-width="2"/>
  <line x1="665" y1="295" x2="675" y2="295" stroke="#ded8cb" stroke-width="2"/>

  <!-- Wiring connections -->
  <path d="M280 250 L420 250 L420 180 L490 180" fill="none" stroke="#b8582d" stroke-width="2"/>
  <circle cx="490" cy="180" r="3" fill="#b8582d"/>
  <text x="310" y="200" fill="#6d6052" font-family="sans-serif" font-size="10" font-weight="600">ECHO / TRIG SENSOR BUS</text>

  <path d="M260 150 L260 190 L430 190 L430 360 L490 360" fill="none" stroke="#606c38" stroke-width="2"/>
  <circle cx="490" cy="360" r="3" fill="#606c38"/>
  <text x="300" y="380" fill="#4f592e" font-family="sans-serif" font-size="10" font-weight="600">PWM HAPTIC BUZZER FEEDBACK</text>

  <!-- Technical Spec Footer -->
  <rect x="50" y="420" width="190" height="34" fill="#ede6da" rx="3" stroke="#c4b8a7" stroke-width="1"/>
  <text x="60" y="442" fill="#241e1b" font-family="sans-serif" font-size="10" font-weight="700">Obstacle Detection: 2cm - 400cm</text>

  <text x="735" y="445" fill="#786f63" font-family="sans-serif" font-size="10" text-anchor="end">Engineering Schematic</text>
</svg>
